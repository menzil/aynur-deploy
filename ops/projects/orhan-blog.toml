projectId = "orhan-blog"
currentPath = "/var/www/blog_public"
repositoryFullName = "aynurcn/blog_public"
repositoryUrl = "https://gitee.com/aynurcn/blog_public.git"
webhookToken = "replace-with-a-unique-webhook-token"
tagPattern = "^deploy-[0-9]{8}-[0-9]{6}$"
retainReleases = 3

[healthCheck]
url = "https://orhan.cn/"
attempts = 5
intervalMs = 2000
timeoutMs = 5000

[deployment]
type = "static"
entryFile = "index.html"

[cacheRefresh]
type = "aliyun_cdn"
profile = "orhan-blog-cdn"
objectPath = "https://static.orhan.cn/"
objectType = "Directory"
force = true
attempts = 3
retryDelayMs = 2000
pollIntervalMs = 5000
timeoutMs = 600000
