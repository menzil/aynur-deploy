[package]
name = "aynur-deploy"
version = "0.2.0"
edition = "2024"
description = "Strict Gitee Tag deployment service"
repository = "https://github.com/menzil/aynur-deploy"
license = "MIT"

[dependencies]
axum = "0.8.9"
chrono = { version = "0.4", features = ["clock"] }
clap = { version = "4.6.6", features = ["derive"] }
regex = "1.11"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.9.0", default-features = false, features = ["derive", "runtime-tokio", "sqlite"] }
thiserror = "2.0"
tokio = { version = "1.47", features = ["fs", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml = "1.1.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = { version = "1.26", features = ["serde", "v7"] }
walkdir = "2.5"

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3.20"
tower = { version = "0.5", features = ["util"] }
